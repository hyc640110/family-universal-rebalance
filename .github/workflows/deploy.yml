name: Deploy GitHub Pages

# Migrated from the legacy branch-based Pages build (Deploy from a branch / gh-pages)
# to the Actions-based Pages deployment API (actions/upload-pages-artifact +
# actions/deploy-pages). The legacy build pipeline started failing outright
# ("Page build failed", then builds stuck indefinitely in "building") independent
# of anything in this repo's content, with no actionable error detail available —
# this is the officially-recommended replacement and bypasses that pipeline
# entirely. Requires the repo's Settings → Pages → Source to be set to
# "GitHub Actions" (not "Deploy from a branch").
#
# actions/deploy-pages replaces the WHOLE site on every deploy — there is no
# partial/incremental update. Production is always rebuilt fresh from main on
# every run. Preview, however, is now only rebuilt on workflow_dispatch (i.e.
# when someone explicitly asks for a Preview refresh for PR acceptance); a
# plain `push` to main reuses whatever Preview content the last successful
# workflow_dispatch run produced, instead of rebuilding it from main. This
# fixes UR-TODO-050: previously every push to main (even from an unrelated PR)
# rebuilt Preview from main too, silently overwriting whatever branch a
# reviewer had just deployed to Preview for acceptance, mid-review.
#
# Semantics this creates (see 008_TODO_BACKLOG.md UR-TODO-050 for the full
# writeup): Preview no longer means "always mirrors main between dispatches" —
# it means "whatever was last explicitly workflow_dispatch'd," indefinitely,
# until the next explicit dispatch. If no workflow_dispatch run has ever
# succeeded yet (e.g. right after this change first lands), there is nothing
# to reuse, so Preview falls back to mirroring main for that one run only.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed only to look up and download the artifact from a previous run
  # (last successful workflow_dispatch) when reusing Preview on a push event.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (Production source)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (main)
        working-directory: main-src
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --include=dev --no-audit --no-fund

      - name: Verify Node/npm runtime and installed dev tooling (main)
        working-directory: main-src
        run: |
          node --version
          npm --version
          npm config get omit
          test -x node_modules/.bin/tsx
          node_modules/.bin/tsx --version

      - name: Run CI regression test gate (main)
        working-directory: main-src
        run: npm run test:ci

      - name: Build production Vite app (main)
        working-directory: main-src
        run: npm run build

      # Preview is only rebuilt from the triggering ref on workflow_dispatch —
      # a plain push to main does not touch it (see top-of-file note).
      - name: Checkout triggering ref (Preview source)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          path: preview-src

      - name: Install dependencies (preview ref)
        if: github.event_name == 'workflow_dispatch'
        working-directory: preview-src
        run: |
          npm config set registry https://registry.npmjs.org/
          npm ci --include=dev --no-audit --no-fund

      - name: Run CI regression test gate (preview ref)
        if: github.event_name == 'workflow_dispatch'
        working-directory: preview-src
        run: npm run test:ci

      - name: Build Preview Vite app (preview ref)
        if: github.event_name == 'workflow_dispatch'
        working-directory: preview-src
        run: npm run build:preview

      - name: Assemble combined bundle (Production, always fresh)
        run: |
          rm -rf combined
          mkdir -p combined
          cp -R main-src/dist/. combined/
          touch combined/.nojekyll

      - name: Add freshly-built Preview into bundle (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          rm -rf combined/preview
          mkdir -p combined/preview
          cp -R preview-src/dist-preview/. combined/preview/

      # push events: reuse the last workflow_dispatch's Preview unchanged
      # instead of rebuilding it from main, so an in-review PR's Preview
      # isn't silently clobbered by an unrelated main push.
      - name: Find last successful workflow_dispatch run (push events only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --repo makes this explicit instead of relying on gh's git-based
          # auto-detection, which fails here: this step's cwd is the workspace
          # root, and every checkout in this workflow uses a `path:` (main-src/
          # preview-src), so the root itself is never a git repo.
          # The lookup itself must never be able to fail the whole job (and
          # therefore skip deploying Production) — a transient API error here
          # just means "nothing to reuse," same as a genuinely empty result.
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=deploy.yml --event=workflow_dispatch --status=success --limit=1 --json databaseId --jq '.[0].databaseId' || true)
          echo "PRIOR_DISPATCH_RUN_ID=${RUN_ID:-}" >> "$GITHUB_ENV"
          if [ -z "$RUN_ID" ]; then
            echo "No prior successful workflow_dispatch run found (or lookup failed); Preview will fall back to mirroring main for this run only."
          else
            echo "Reusing Preview from workflow_dispatch run $RUN_ID."
          fi

      # Both steps below are allowed to fail (expired/deleted artifact, API
      # hiccup, etc.) without failing the job — reuse plumbing must never be
      # able to block a Production deploy. The fallback step after them
      # checks whether combined/preview actually ended up populated and
      # mirrors main into it if not, regardless of why it's missing.
      - name: Download that run's deployed Pages artifact (push events only)
        if: github.event_name == 'push' && env.PRIOR_DISPATCH_RUN_ID != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: ${{ env.PRIOR_DISPATCH_RUN_ID }}
          github-token: ${{ github.token }}
          path: prior-artifact

      - name: Extract prior run's Preview into bundle (push events only)
        if: github.event_name == 'push' && env.PRIOR_DISPATCH_RUN_ID != ''
        continue-on-error: true
        run: |
          mkdir -p prior-extracted
          tar -xf prior-artifact/artifact.tar -C prior-extracted
          rm -rf combined/preview
          mkdir -p combined/preview
          cp -R prior-extracted/preview/. combined/preview/

      - name: Fallback — mirror main into Preview (push events, nothing successfully reused)
        if: github.event_name == 'push'
        run: |
          if [ -f combined/preview/index.html ]; then
            echo "Preview was successfully reused from a prior workflow_dispatch run; skipping fallback."
          else
            echo "No usable reused Preview (no prior dispatch, or the reuse steps above failed); mirroring main into Preview for this run only."
            rm -rf combined/preview
            mkdir -p combined/preview
            cp -R main-src/dist/. combined/preview/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
